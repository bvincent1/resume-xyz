openapi: 3.0.3
info:
  title: Resume XYZ API
  version: 0.1.0
paths:
  /api/job-automation/job-urls/:
    post:
      operationId: api_job_automation_job_urls_create
      summary: Create a job URL and queue a scan
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobURL'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/JobURL'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/JobURL'
        required: true
      security:
      - ApiKeyAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobURL'
          description: ''
        '401':
          description: Invalid or missing API key.
components:
  schemas:
    JobURL:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        url:
          type: string
          format: uri
          maxLength: 200
        status:
          type: string
          readOnly: true
      required:
      - id
      - status
      - url
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
